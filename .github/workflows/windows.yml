# Builds the Windows installer (NSIS), portable .exe and .zip on a Windows runner.
# The Linux development machine has no Wine/NSIS, so installers are made here.
name: windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/unit/*.test.js
        shell: bash
      - run: pnpm exec electron-builder --win nsis portable zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: pm-sim-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
