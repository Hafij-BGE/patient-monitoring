# Builds the Windows installer (NSIS), portable .exe and .zip on a Windows runner.
# The Linux development machine has no Wine/NSIS, so installers are made here.
name: windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed to create the GitHub release on a v* tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/unit/*.test.js
        shell: bash
      - run: pnpm exec electron-builder --win nsis portable zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: pm-sim-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.zip \
            --repo "$GITHUB_REPOSITORY" --title "PM-SIM $GITHUB_REF_NAME" \
            --notes "Windows x64 builds of PM-SIM: NSIS installer, portable .exe and .zip. Unsigned, so Windows SmartScreen shows a warning. Educational simulation only. Simulated values and consumer wearable readings are not a substitute for clinical monitoring or medical advice."
